scalar DateTime

type Query {
  watches: [Watch!]!
  watch(id: ID!): Watch
  run(id: ID!): Run
  "New listings and price drops across all watches, newest first."
  feed(limit: Int = 100): [FeedItem!]!
  system: SystemStatus!
}

type Mutation {
  createWatch(input: WatchInput!): Watch!
  updateWatch(id: ID!, input: WatchInput!): Watch!
  deleteWatch(id: ID!): Boolean!
  "Queue a run now. Returns the already-queued run if one exists."
  runWatch(id: ID!): Run!
  runAll: [Run!]!
  markWatchSeen(id: ID!): Watch!
  markAllSeen: Boolean!
  sendTestNotification: Boolean!
  resumeScheduler: SystemStatus!
}

type SystemStatus {
  csfloatKeyConfigured: Boolean!
  discordConfigured: Boolean!
  schedulerSuspended: Boolean!
  suspendedReason: String
  queueSize: Int!
  timezone: String!
}

"CSFloat sort_by values. Keep in sync with CSFLOAT_SORTS in src/core/types.ts."
enum SortBy {
  most_recent
  lowest_price
  highest_price
  lowest_float
  highest_float
  best_deal
  highest_discount
}

"CSFloat /listings filters. Prices in USD cents."
type CsfloatQuery {
  def_index: Int
  paint_index: Int
  market_hash_name: String
  min_float: Float
  max_float: Float
  category: Int
  min_price: Int
  max_price: Int
  type: String
  stickers: String
  collection: String
  rarity: Int
  "Null = most_recent."
  sort_by: SortBy
}

input CsfloatQueryInput {
  def_index: Int
  paint_index: Int
  market_hash_name: String
  min_float: Float
  max_float: Float
  category: Int
  min_price: Int
  max_price: Int
  type: String
  stickers: String
  collection: String
  rarity: Int
  "Null = most_recent."
  sort_by: SortBy
}

input WatchInput {
  "Empty or null: named after the search, e.g. \"★ Bayonet | Night · Lowest float\"."
  name: String
  query: CsfloatQueryInput!
  seeds: [Int!]
  schedule: String
  maxPages: Int
  enabled: Boolean
  notify: Boolean
}

type Watch {
  id: ID!
  name: String!
  query: CsfloatQuery!
  seeds: [Int!]!
  schedule: String
  maxPages: Int!
  enabled: Boolean!
  notify: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  lastSeenAt: DateTime
  unreadCount: Int!
  isRunning: Boolean!
  nextRunAt: DateTime
  lastRun: Run
  runs(limit: Int = 20): [Run!]!
  "Union of the latest snapshot of every seed, in the watch's sort order."
  currentListings: [Listing!]!
  csfloatSearchUrl: String!
  "Item this watch searches for, e.g. \"★ Bayonet | Night\". From the filters or the last fetched listings; null before the first run."
  itemName: String
}

enum RunTrigger {
  MANUAL
  CRON
}

enum RunStatus {
  QUEUED
  RUNNING
  DONE
  FAILED
}

enum FeedKind {
  NEW
  PRICE_DROP
}

type Run {
  id: ID!
  watchId: ID!
  trigger: RunTrigger!
  status: RunStatus!
  queuedAt: DateTime!
  startedAt: DateTime
  finishedAt: DateTime
  requests: Int!
  baseline: Boolean!
  total: Int!
  added: [Listing!]!
  priceChanges: [PriceChange!]!
  goneIds: [ID!]!
  error: String
}

type PriceChange {
  listing: Listing!
  before: Int!
  after: Int!
}

type Listing {
  id: ID!
  name: String!
  "USD cents"
  price: Int!
  type: String!
  seed: Int
  float: Float
  "CSFloat float rank (1 = lowest float of this skin). Null when unranked."
  lowRank: Int
  "CSFloat float rank (1 = highest float of this skin). Null when unranked."
  highRank: Int
  stattrak: Boolean!
  stickers: [String!]!
  "Stickers with images, in slot order. Older snapshots have names only (iconUrl null)."
  stickerDetails: [Sticker!]!
  createdAt: DateTime!
  csfloatUrl: String!
  inspectLink: String
  iconUrl: String
}

type Sticker {
  name: String!
  iconUrl: String
  "0-based position on the weapon"
  slot: Int
  "Scrape, 0 = pristine. Null when unknown."
  wear: Float
}

type FeedItem {
  id: ID!
  kind: FeedKind!
  at: DateTime!
  listing: Listing!
  priceBefore: Int
  runId: ID!
  "Null if the watch was deleted."
  watch: Watch
}
