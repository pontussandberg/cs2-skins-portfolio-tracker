scalar DateTime

type Query {
  watches: [Watch!]!
  watch(id: ID!): Watch
  run(id: ID!): Run
  "New listings and price drops across all watches, newest first."
  feed(limit: Int = 100): [FeedItem!]!
  system: SystemStatus!
  "Your items and their value. Synced from CSFloat when missing; re-synced in the background when over an hour old."
  portfolio: Portfolio!
  "Your portfolio as it was when a snapshot was saved (read-only). Null if the snapshot doesn't exist."
  portfolioSnapshot(id: ID!): Portfolio
  "Saved snapshots, newest first."
  portfolioSnapshots: [PortfolioSnapshot!]!
}

type Mutation {
  createWatch(input: WatchInput!): Watch!
  updateWatch(id: ID!, input: WatchInput!): Watch!
  deleteWatch(id: ID!): Boolean!
  "Save the dashboard order. Watches not listed keep their order after the listed ones."
  reorderWatches(ids: [ID!]!): [Watch!]!
  "Queue a run now. Returns the already-queued run if one exists."
  runWatch(id: ID!): Run!
  runAll: [Run!]!
  markWatchSeen(id: ID!): Watch!
  markAllSeen: Boolean!
  sendTestNotification: Boolean!
  resumeScheduler: SystemStatus!
  "Fetch your inventory from CSFloat now."
  syncInventory: Portfolio!
  "Save your valuation of an item. All fields null resets it to market value."
  setValuation(key: ID!, input: ValuationInput!): Portfolio!
  setPortfolioSettings(input: PortfolioSettingsInput!): Portfolio!
  "Freeze the current inventory (as last synced), its prices and your valuations."
  takePortfolioSnapshot(label: String): PortfolioSnapshot!
  deletePortfolioSnapshot(id: ID!): Boolean!
}

type SystemStatus {
  csfloatKeyConfigured: Boolean!
  discordConfigured: Boolean!
  schedulerSuspended: Boolean!
  suspendedReason: String
  queueSize: Int!
  timezone: String!
}

"CSFloat sort_by values. Keep in sync with CSFLOAT_SORTS in src/core/types.ts."
enum SortBy {
  most_recent
  lowest_price
  highest_price
  lowest_float
  highest_float
  best_deal
  highest_discount
}

"CSFloat /listings filters. Prices in USD cents."
type CsfloatQuery {
  def_index: Int
  paint_index: Int
  market_hash_name: String
  min_float: Float
  max_float: Float
  category: Int
  min_price: Int
  max_price: Int
  type: String
  stickers: String
  collection: String
  rarity: Int
  "CSFloat search preset, e.g. sticker_combos."
  filter: String
  "Null = most_recent."
  sort_by: SortBy
}

input CsfloatQueryInput {
  def_index: Int
  paint_index: Int
  market_hash_name: String
  min_float: Float
  max_float: Float
  category: Int
  min_price: Int
  max_price: Int
  type: String
  stickers: String
  collection: String
  rarity: Int
  "CSFloat search preset, e.g. sticker_combos."
  filter: String
  "Null = most_recent."
  sort_by: SortBy
}

input WatchInput {
  "Empty or null: named after the search, e.g. \"★ Bayonet | Night · Lowest float\"."
  name: String
  query: CsfloatQueryInput!
  seeds: [Int!]
  schedule: String
  maxPages: Int
  enabled: Boolean
  notify: Boolean
}

type Watch {
  id: ID!
  name: String!
  query: CsfloatQuery!
  seeds: [Int!]!
  schedule: String
  maxPages: Int!
  enabled: Boolean!
  notify: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  lastSeenAt: DateTime
  unreadCount: Int!
  isRunning: Boolean!
  nextRunAt: DateTime
  lastRun: Run
  runs(limit: Int = 20): [Run!]!
  "Union of the latest snapshot of every seed, in the watch's sort order."
  currentListings: [Listing!]!
  csfloatSearchUrl: String!
  "Item this watch searches for, e.g. \"★ Bayonet | Night\". From the filters or the last fetched listings; null before the first run."
  itemName: String
}

enum RunTrigger {
  MANUAL
  CRON
}

enum RunStatus {
  QUEUED
  RUNNING
  DONE
  FAILED
}

enum FeedKind {
  NEW
  PRICE_DROP
}

type Run {
  id: ID!
  watchId: ID!
  trigger: RunTrigger!
  status: RunStatus!
  queuedAt: DateTime!
  startedAt: DateTime
  finishedAt: DateTime
  requests: Int!
  baseline: Boolean!
  total: Int!
  added: [Listing!]!
  priceChanges: [PriceChange!]!
  goneIds: [ID!]!
  error: String
}

type PriceChange {
  listing: Listing!
  before: Int!
  after: Int!
}

type Listing {
  id: ID!
  name: String!
  "USD cents"
  price: Int!
  type: String!
  seed: Int
  float: Float
  "CSFloat float rank (1 = lowest float of this skin). Null when unranked."
  lowRank: Int
  "CSFloat float rank (1 = highest float of this skin). Null when unranked."
  highRank: Int
  stattrak: Boolean!
  stickers: [String!]!
  "Stickers with images, in slot order. Older snapshots have names only (iconUrl null)."
  stickerDetails: [Sticker!]!
  "CSFloat sticker percentage (SP): share of the stickers' value asked on top of the item's reference price. Null when unknown."
  stickerPercent: Float
  createdAt: DateTime!
  csfloatUrl: String!
  inspectLink: String
  iconUrl: String
}

type Sticker {
  name: String!
  iconUrl: String
  "0-based position on the weapon"
  slot: Int
  "Scrape, 0 = pristine. Null when unknown."
  wear: Float
  "CSFloat reference price, USD cents. Null when unknown."
  price: Int
}

type FeedItem {
  id: ID!
  kind: FeedKind!
  at: DateTime!
  listing: Listing!
  priceBefore: Int
  runId: ID!
  "Found after you last viewed its watch (opening it or Mark all read). False once seen, or if the watch was deleted."
  unread: Boolean!
  "Null if the watch was deleted."
  watch: Watch
}

"Your owned items (from CSFloat's inventory endpoint) valued with your own premiums. Prices in USD cents."
type Portfolio {
  "\"portfolio\" for the live one (lets mutations update it in the cache), \"snapshot:<id>\" for a snapshot."
  id: ID!
  "Set when this is a saved snapshot rather than the live portfolio."
  snapshot: PortfolioSnapshot
  "Null before the first successful sync."
  syncedAt: DateTime
  syncing: Boolean!
  "Why the last sync failed; null once one succeeds."
  syncError: String
  settings: PortfolioSettings!
  "Most valuable first."
  items: [PortfolioItem!]!
}

type PortfolioSettings {
  "Craft % for items with stickers that have no craft % of their own."
  defaultCraftPercent: Float!
}

input PortfolioSettingsInput {
  defaultCraftPercent: Float!
}

type PortfolioItem {
  "Unique per portfolio (live and each snapshot have their own), for caching."
  id: ID!
  "Stable item key for valuations and comparing snapshots: survives asset id changes (trades, storage units) for items with a float."
  key: ID!
  name: String!
  "CSFloat item type: skin, agent, container, charm, collectible, music_kit, ..."
  type: String!
  iconUrl: String
  float: Float
  seed: Int
  lowRank: Int
  highRank: Int
  stattrak: Boolean!
  souvenir: Boolean!
  tradable: Boolean!
  "The CSFloat listing when the item is listed for sale."
  csfloatUrl: String
  inspectLink: String
  stickers: [Sticker!]!
  "Attached charms."
  charms: [Sticker!]!
  valuation: Valuation
  value: ItemValue!
}

type Valuation {
  "Share of the sticker value the craft adds (15 = +15%). Null = portfolio default."
  craftPercent: Float
  "Skin value as a multiple of market price."
  multiplier: Float
  "Fixed skin value; wins over multiplier."
  skinPrice: Int
  note: String
  updatedAt: DateTime!
}

input ValuationInput {
  craftPercent: Float
  multiplier: Float
  skinPrice: Int
  note: String
}

type ItemValue {
  "CSFloat's price for the item itself (float-adjusted)."
  market: Int!
  "Your value for the item itself: market, x multiplier, or fixed."
  skin: Int!
  "Reference value of the applied stickers."
  stickers: Int!
  "Craft % used (own or default; 0 without stickers)."
  craftPercent: Float!
  "What the craft adds: stickers x craftPercent."
  craft: Int!
  "Attached charms at reference price."
  charms: Int!
  "skin + craft + charms"
  total: Int!
  "market + charms: what the market pays without your premiums."
  marketTotal: Int!
}

type PortfolioSnapshot {
  id: ID!
  label: String
  takenAt: DateTime!
  totals: PortfolioTotals!
}

type PortfolioTotals {
  items: Int!
  "Your valuation of everything."
  value: Int!
  "Market value of everything (item prices + charms)."
  market: Int!
  "Reference value of all applied stickers."
  stickers: Int!
}
